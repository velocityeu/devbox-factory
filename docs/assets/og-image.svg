<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#12121a"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(99,102,241,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing orbs -->
  <circle cx="200" cy="100" r="150" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="530" r="180" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="315" r="100" fill="#8b5cf6" opacity="0.1" filter="url(#glow)"/>

  <!-- Lightning icon -->
  <g transform="translate(100, 200)">
    <circle cx="60" cy="60" r="55" fill="url(#text-grad)" opacity="0.9"/>
    <path d="M66 25L42 65h18l-6 35 32-42H66l6-33z" fill="url(#bolt-grad)" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- Main title -->
  <text x="200" y="250" font-family="Inter, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff">
    DevBox<tspan fill="url(#text-grad)">Factory</tspan>
  </text>

  <!-- Tagline -->
  <text x="200" y="320" font-family="Inter, -apple-system, sans-serif" font-size="36" font-weight="500" fill="#a1a1aa">
    Vibe Code in 2 Minutes, Not 2 Days
  </text>

  <!-- Features -->
  <text x="200" y="400" font-family="Inter, -apple-system, sans-serif" font-size="24" fill="#71717a">
    <tspan fill="#22c55e">✓</tspan> Claude Code
    <tspan fill="#22c55e">✓</tspan> Cursor IDE
    <tspan fill="#22c55e">✓</tspan> VS Code + AI
    <tspan fill="#22c55e">✓</tspan> Docker &amp; More
  </text>

  <!-- Terminal mockup -->
  <g transform="translate(700, 350)">
    <rect x="0" y="0" width="420" height="220" rx="12" fill="#1a1a25" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="0" y="0" width="420" height="35" rx="12" fill="#252530"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="17" r="6" fill="#27ca40"/>
    <text x="20" y="70" font-family="JetBrains Mono, monospace" font-size="14" fill="#06b6d4">PS C:\&gt;</text>
    <text x="100" y="70" font-family="JetBrains Mono, monospace" font-size="14" fill="#fff">irm devbox.run | iex</text>
    <text x="20" y="100" font-family="JetBrains Mono, monospace" font-size="13" fill="#22c55e">✓ Installing Claude Code...</text>
    <text x="20" y="125" font-family="JetBrains Mono, monospace" font-size="13" fill="#22c55e">✓ Configuring VS Code...</text>
    <text x="20" y="150" font-family="JetBrains Mono, monospace" font-size="13" fill="#22c55e">✓ Setting up Docker...</text>
    <text x="20" y="185" font-family="JetBrains Mono, monospace" font-size="14" fill="#6366f1">✨ Ready to vibe code!</text>
  </g>

  <!-- URL -->
  <text x="200" y="550" font-family="JetBrains Mono, monospace" font-size="20" fill="#6366f1">
    github.com/velocityeu/devbox-factory
  </text>

  <!-- Badge -->
  <g transform="translate(200, 470)">
    <rect width="140" height="32" rx="16" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.5)" stroke-width="1"/>
    <text x="70" y="21" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6366f1" text-anchor="middle">
      Open Source
    </text>
  </g>
</svg>
